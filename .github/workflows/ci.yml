name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check setup scripts
        run: bash -n scripts/setup.sh scripts/run-mcp.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify package
        run: npm pack --dry-run
