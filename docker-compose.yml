services:
  yt-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-mp3-mp4-converter
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DOWNLOAD_DIR=/tmp/yt-converter-downloads
      - NODE_ENV=production
      # Optional: Max file size in MB
      - MAX_FILE_SIZE_MB=500
    volumes:
      # Persist downloads to host (optional). The whisper model is baked into
      # the image at /models (WHISPER_MODEL_PATH) when the build can download
      # it; do not mount a directory over /models or an empty volume would
      # hide the model. If the bake was skipped (rate limited), mount a
      # directory containing ggml-base.en.bin at /models to enable STT.
      - ./downloads:/tmp/yt-converter-downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
